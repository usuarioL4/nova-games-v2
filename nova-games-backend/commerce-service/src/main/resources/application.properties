spring.application.name=commerce-service
server.port=8083
management.endpoints.web.exposure.include=health,info
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:novagames}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_URL:http://localhost:8081/.well-known/jwks.json}
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/commerce-service;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
